name: Sync library index

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      full_bootstrap:
        description: "Run checkpoint batches until bootstrap completes and publishes the first index"
        required: false
        type: boolean
        default: false
      max_repositories:
        description: "Repositories per checkpoint batch (must be greater than 0 for full bootstrap)"
        required: false
        default: "250"
      workers:
        description: "Concurrent repository scans and package uploads (1-4)"
        required: false
        default: "4"

concurrency:
  group: sync-library-index-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, ailydeMac-mini, macOS, ARM64]
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.full_bootstrap && 2880 || 350 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install .

      - name: Test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Sync packages and index
        env:
          RUSTFS_PUBLIC_DOWNLOAD_BASE_URL: ${{ vars.RUSTFS_PUBLIC_DOWNLOAD_BASE_URL }}
          R2_PUBLIC_DOWNLOAD_BASE_URL: ${{ vars.R2_PUBLIC_DOWNLOAD_BASE_URL }}
          FULL_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.full_bootstrap && 'true' || 'false' }}
          MAX_REPOSITORIES_PER_RUN: ${{ github.event.inputs.max_repositories || vars.MAX_REPOSITORIES_PER_RUN || '250' }}
          SCAN_WORKERS: ${{ github.event.inputs.workers || vars.SCAN_WORKERS || '4' }}
          RUSTFS_ENDPOINT: ${{ secrets.RUSTFS_ENDPOINT }}
          RUSTFS_ACCESS_KEY_ID: ${{ secrets.RUSTFS_ACCESS_KEY_ID || secrets.RUSTFS_ACCESS_KEY }}
          RUSTFS_SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET_ACCESS_KEY || secrets.RUSTFS_SECRET_KEY }}
          RUSTFS_PACKAGE_BUCKET: ${{ secrets.RUSTFS_PACKAGE_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PACKAGE_BUCKET: ${{ secrets.R2_PACKAGE_BUCKET }}
        run: |
          run_sync_with_retries() {
            local attempt sync_status delay_seconds
            for attempt in 1 2 3; do
              if aily-coder-libraries-sync "$@"; then
                return 0
              else
                sync_status=$?
              fi

              if [[ "$sync_status" -eq 75 ]]; then
                return 75
              fi
              if [[ "$attempt" -eq 3 ]]; then
                return "$sync_status"
              fi

              delay_seconds=$((attempt * 15))
              echo "Sync failed with exit code $sync_status; retrying in ${delay_seconds}s (attempt $((attempt + 1))/3)"
              sleep "$delay_seconds"
            done
          }

          if [[ "$FULL_BOOTSTRAP" == "true" ]]; then
            while true; do
              if run_sync_with_retries --require-bootstrap-complete; then
                break
              else
                sync_status=$?
              fi
              if [[ "$sync_status" -ne 75 ]]; then
                exit "$sync_status"
              fi
            done
          else
            run_sync_with_retries
          fi
